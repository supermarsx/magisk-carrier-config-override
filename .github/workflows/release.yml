name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      working-directory: cco-app
      run: chmod +x gradlew

    - name: Build release APK
      working-directory: cco-app
      run: ./gradlew assembleRelease
      # Note: You'll need to configure signing for actual releases

    - name: Package Magisk module
      run: |
        cd cco-carrierconfig
        zip -r cco-carrierconfig-${{ github.ref_name }}.zip . \
          -x "*.md" \
          -x ".git/*" \
          -x "*.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          cco-app/app/build/outputs/apk/release/app-release.apk
          cco-carrierconfig/cco-carrierconfig-${{ github.ref_name }}.zip
        draft: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
