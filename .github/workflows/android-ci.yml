name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      working-directory: cco-app
      run: chmod +x gradlew

    - name: Build debug APK
      working-directory: cco-app
      run: ./gradlew assembleDebug

    - name: Run tests
      working-directory: cco-app
      run: ./gradlew test

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: cco-app-debug
        path: cco-app/app/build/outputs/apk/debug/app-debug.apk

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      working-directory: cco-app
      run: chmod +x gradlew

    - name: Run lint
      working-directory: cco-app
      run: ./gradlew lint

    - name: Upload lint results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-results
        path: cco-app/app/build/reports/lint-results-*.html

  package-magisk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Package Magisk module
      run: |
        cd cco-carrierconfig
        zip -r cco-carrierconfig.zip . \
          -x "*.md" \
          -x ".git/*" \
          -x "*.zip"

    - name: Upload Magisk module
      uses: actions/upload-artifact@v4
      with:
        name: cco-carrierconfig-module
        path: cco-carrierconfig/cco-carrierconfig.zip

  shellcheck:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run ShellCheck on Magisk scripts
      run: |
        sudo apt-get install -y shellcheck
        shellcheck cco-carrierconfig/*.sh || true
        # Note: Some Magisk-specific syntax may trigger warnings
